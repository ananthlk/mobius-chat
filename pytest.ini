[pytest]
testpaths = tests
asyncio_mode = auto
# Gate: run with -m "not integration"
markers =
    integration: tests that need real DB, MCP, or external APIs (excluded by default gate)
    credentialing_integration: real LLM and/or provider-roster API for full report smoke (set MOBIUS_RUN_CREDENTIALING_INTEGRATION=1)
    requires_rag: tests that need CHAT_RAG_DATABASE_URL / RAG
    requires_skills: tests that need MCP or skills (e.g. Google, scraper)
    # CONTRACT TAGS (Layer 2). Format: guards("<node_key>:<guarantee_slug>").
    # node_key must match the schema node EXACTLY (state_load, not
    # app.stages.state_load) — the same binding rule the latency spans use, so
    # one name means one thing across coverage, spans and the schema.
    #
    # Only a test that ACTUALLY ASSERTS the guarantee may carry the tag. A test
    # that merely imports or exercises the node must not: the whole point is
    # that a node cannot mark itself GUARDED, and a tag on a test that would
    # still pass with the guarantee removed is worse than no tag — it is a
    # green light with nothing behind it.
    guards: names a contract guarantee this test enforces, as <node_key>:<slug>
