<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prompt Studio — Mobius</title>
  <link rel="icon" href="static/logo.svg" type="image/svg+xml"/>
  <style>
    :root {
      --bg: #fafbfc; --card: #ffffff; --card-2: #f4f5f7;
      --text-1: #1a1d21; --text-2: #4b5262; --text-3: #7a8194;
      --border: #e2e8f0; --border-strong: #d1d7e0;
      --violet: #7c3aed; --violet-wash: #f2ecfd; --violet-text: #5b21b6;
      --indigo: #5b5ef4; --indigo-wash: #edeeff; --indigo-text: #3730a3;
      --emerald: #10b981; --emerald-wash: #e6f7f1; --emerald-text: #047857;
      --amber: #f59e0b; --amber-wash: #fef3e2; --amber-text: #92400e;
      --red: #dc2626; --red-wash: #fdecec; --red-text: #991b1b;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1015; --card: #161a21; --card-2: #1d222b;
        --text-1: #eef0f4; --text-2: #a7afc0; --text-3: #6f7788;
        --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
        --violet: #a78bfa; --violet-wash: rgba(167,139,250,.14); --violet-text: #c4b5fd;
        --indigo: #8b8ef8; --indigo-wash: rgba(139,142,248,.14); --indigo-text: #b4b6fb;
        --emerald: #34d399; --emerald-wash: rgba(52,211,153,.14); --emerald-text: #6ee7b7;
        --amber: #fbbf24; --amber-wash: rgba(251,191,36,.14); --amber-text: #fcd34d;
        --red: #f87171; --red-wash: rgba(248,113,113,.14); --red-text: #fca5a5;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e1015; --card: #161a21; --card-2: #1d222b;
      --text-1: #eef0f4; --text-2: #a7afc0; --text-3: #6f7788;
      --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
      --violet: #a78bfa; --violet-wash: rgba(167,139,250,.14); --violet-text: #c4b5fd;
      --indigo: #8b8ef8; --indigo-wash: rgba(139,142,248,.14); --indigo-text: #b4b6fb;
      --emerald: #34d399; --emerald-wash: rgba(52,211,153,.14); --emerald-text: #6ee7b7;
      --amber: #fbbf24; --amber-wash: rgba(251,191,36,.14); --amber-text: #fcd34d;
      --red: #f87171; --red-wash: rgba(248,113,113,.14); --red-text: #fca5a5;
    }
    :root[data-theme="light"] {
      --bg: #fafbfc; --card: #ffffff; --card-2: #f4f5f7;
      --text-1: #1a1d21; --text-2: #4b5262; --text-3: #7a8194;
      --border: #e2e8f0; --border-strong: #d1d7e0;
      --violet: #7c3aed; --violet-wash: #f2ecfd; --violet-text: #5b21b6;
      --indigo: #5b5ef4; --indigo-wash: #edeeff; --indigo-text: #3730a3;
      --emerald: #10b981; --emerald-wash: #e6f7f1; --emerald-text: #047857;
      --amber: #f59e0b; --amber-wash: #fef3e2; --amber-text: #92400e;
      --red: #dc2626; --red-wash: #fdecec; --red-text: #991b1b;
    }
    * { box-sizing: border-box; }
    html { font-size: 16px; }
    body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text-1); -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; }

    .app { display: grid; grid-template-columns: 64px 1fr; height: 100vh; }
    .rail { background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; }
    .rail-back { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-3); text-decoration: none; font-size: 16px; margin-bottom: 10px; }
    .rail-back:hover { background: var(--card-2); color: var(--text-1); }
    .rail-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; margin-top: 6px; }
    .rail-btn { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-3); border: none; background: none; font-size: 16px; }
    .rail-item:hover .rail-btn { background: var(--card-2); color: var(--text-1); }
    .rail-item.active .rail-btn { background: var(--violet-wash); color: var(--violet); }
    .rail-label { font-size: 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); margin-top: 2px; }
    .rail-item.active .rail-label { color: var(--violet); }

    .main { display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 52px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; background: var(--card); }
    .topbar h1 { font-size: 15px; font-weight: 500; margin: 0; }
    .topbar-sub { font-size: 12px; color: var(--text-3); }
    .actor { margin-left: auto; font-size: 11.5px; color: var(--text-3); }
    .actor b { color: var(--text-2); font-weight: 600; }

    .body { flex: 1; overflow: hidden; }
    .screen { display: none; height: 100%; }
    .screen.active { display: flex; }

    .list-pane { width: 300px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; background: var(--card); }
    .list-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); padding: 14px 16px 6px; }
    .list-row { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .list-row:hover { background: var(--card-2); }
    .list-row.selected { background: var(--violet-wash); box-shadow: inset 3px 0 0 var(--violet); }
    .list-row-title { font-family: var(--mono); font-size: 12px; font-weight: 500; word-break: break-all; }
    .list-row-meta { font-size: 11px; color: var(--text-3); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .pill { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
    .pill-live { background: var(--emerald-wash); color: var(--emerald-text); }
    .pill-draft { background: var(--amber-wash); color: var(--amber-text); }
    .pill-off { background: var(--card-2); color: var(--text-3); }
    .pill-authority { background: var(--violet-wash); color: var(--violet-text); }

    .canvas { flex: 1; overflow-y: auto; padding: 24px 28px; }
    .crumbs { font-size: 12px; color: var(--text-3); margin-bottom: 4px; font-family: var(--mono); }
    .h1 { font-size: 18px; font-weight: 500; margin: 0 0 2px; font-family: var(--mono); word-break: break-all; }
    .lede { font-size: 13px; color: var(--text-2); margin-bottom: 20px; }
    .empty { color: var(--text-3); font-size: .875rem; padding: 2rem; text-align: center; }

    .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); font-weight: 600; margin: 24px 0 10px; }
    .section-label:first-child { margin-top: 0; }

    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .stat-label { font-size: 11px; color: var(--text-3); }
    .stat-value { font-size: 20px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }

    .timeline { position: relative; padding-left: 22px; }
    .timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
    .tl-item { position: relative; padding-bottom: 18px; }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-dot { position: absolute; left: -22px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--border-strong); }
    .tl-dot.live { border-color: var(--emerald); background: var(--emerald); }
    .tl-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .tl-head { display: flex; align-items: center; gap: 8px; }
    .tl-ver { font-family: var(--mono); font-weight: 600; font-size: 13px; }
    .tl-meta { font-size: 11px; color: var(--text-3); margin-left: auto; }
    .tl-actor { font-size: 12px; color: var(--text-2); margin-top: 4px; }
    .tl-diff { margin-top: 8px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; background: var(--card-2); border-radius: 7px; padding: 8px 10px; max-height: 260px; overflow-y: auto; }
    .diff-add { background: var(--emerald-wash); color: var(--emerald-text); display: block; padding: 0 4px; border-radius: 3px; white-space: pre-wrap; }
    .diff-del { background: var(--red-wash); color: var(--red-text); display: block; padding: 0 4px; border-radius: 3px; text-decoration: line-through; opacity: .75; white-space: pre-wrap; }
    .diff-ctx { color: var(--text-3); display: block; padding: 0 4px; white-space: pre-wrap; }
    .tl-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

    .btn { font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--card); color: var(--text-2); cursor: pointer; }
    .btn:hover { border-color: var(--violet); color: var(--violet); }
    .btn.primary { background: var(--violet); border-color: var(--violet); color: #fff; }
    .btn.primary:hover { opacity: .9; color: #fff; }
    .btn.danger:hover { border-color: var(--red); color: var(--red); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    .editor-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 24px; }
    .editor-title { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
    textarea.editor-body { width: 100%; min-height: 220px; font-family: var(--mono); font-size: 12px; line-height: 1.65; color: var(--text-1); background: var(--card-2); border-radius: 7px; padding: 12px 14px; border: 1px solid var(--border); resize: vertical; }
    label { font-size: .75rem; color: var(--text-3); display: block; margin: .6rem 0 .25rem; }
    input[type=checkbox] { width: auto; }

    table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.data th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-3); padding: 8px 10px; border-bottom: 1px solid var(--border); }
    table.data td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.data tr:last-child td { border-bottom: none; }
    table.data tr:hover td { background: var(--card-2); }
    .mono { font-family: var(--mono); font-size: 11.5px; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: .4rem .75rem; font-size: .8125rem; }
    .kv dt { color: var(--text-3); margin: 0; }
    .kv dd { color: var(--text-1); font-family: var(--mono); word-break: break-all; margin: 0; }

    .spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; vertical-align: middle; }
    .spark i { width: 3px; background: var(--indigo); border-radius: 1px; opacity: .5; display: block; }
    .spark i:last-child { opacity: 1; }
  </style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <a class="rail-back" href="/" title="Back to chat">&larr;</a>
    <div class="rail-item active" data-screen="blocks">
      <button class="rail-btn">&#9635;</button>
      <span class="rail-label">Blocks</span>
    </div>
    <div class="rail-item" data-screen="comps">
      <button class="rail-btn">&#9776;</button>
      <span class="rail-label">Comps</span>
    </div>
    <div class="rail-item" data-screen="mon">
      <button class="rail-btn">&#9711;</button>
      <span class="rail-label">Monitor</span>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <h1>Prompt Studio</h1>
      <span class="topbar-sub" id="topbarSub">Blocks</span>
      <span class="actor">Acting as <input id="actorInput" type="text" placeholder="your name" style="width:110px;border:1px solid var(--border-strong);border-radius:6px;padding:3px 6px;font-size:11.5px;background:var(--card);color:var(--text-1);font-family:var(--sans)"/></span>
    </div>
    <div class="body">
      <div class="screen active" id="screen-blocks">
        <div class="list-pane" id="blocksList"></div>
        <div class="canvas" id="blocksDetail"><div class="empty">Select a block on the left.</div></div>
      </div>
      <div class="screen" id="screen-comps">
        <div class="list-pane" id="compsList"></div>
        <div class="canvas" id="compsDetail"><div class="empty">Select a composition on the left.</div></div>
      </div>
      <div class="screen" id="screen-mon">
        <div class="canvas" id="monDetail" style="width:100%"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';
let actor = localStorage.getItem('mobius.prompts.actor') || 'unknown';
const actorInput = document.getElementById('actorInput');
actorInput.value = actor;
actorInput.addEventListener('input', () => {
  actor = actorInput.value.trim() || 'unknown';
  localStorage.setItem('mobius.prompts.actor', actor);
});

function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtNum(n, d=1) { return (n === null || n === undefined) ? '—' : Number(n).toFixed(d); }
function fmtWhen(iso) { return iso ? new Date(iso).toLocaleString() : '—'; }
function relTime(iso) {
  if (!iso) return '—';
  const ms = Date.now() - new Date(iso).getTime();
  const m = Math.round(ms / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}

async function jget(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function jpost(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// Simple line-based LCS diff -- honest, not fancy. Good enough at prompt-body scale (tens of lines).
function lineDiff(oldText, newText) {
  const a = (oldText || '').split('\n'), b = (newText || '').split('\n');
  const n = a.length, m = b.length;
  const dp = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push({t: 'ctx', l: a[i]}); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) { out.push({t: 'del', l: a[i]}); i++; }
    else { out.push({t: 'add', l: b[j]}); j++; }
  }
  while (i < n) { out.push({t: 'del', l: a[i]}); i++; }
  while (j < m) { out.push({t: 'add', l: b[j]}); j++; }
  return out;
}
function renderDiff(ops) {
  return ops.map(o => {
    const cls = o.t === 'add' ? 'diff-add' : o.t === 'del' ? 'diff-del' : 'diff-ctx';
    const prefix = o.t === 'add' ? '+ ' : o.t === 'del' ? '- ' : '  ';
    return `<span class="${cls}">${esc(prefix + o.l)}</span>`;
  }).join('');
}

// ── Rail nav ─────────────────────────────────────────────────────────────
document.querySelectorAll('.rail-item[data-screen]').forEach(el => el.addEventListener('click', () => selectTab(el.dataset.screen)));
const TAB_LABELS = { blocks: 'Blocks', comps: 'Compositions', mon: 'Monitoring' };
let loadedTabs = new Set();

async function selectTab(tab) {
  document.querySelectorAll('.rail-item[data-screen]').forEach(el => el.classList.toggle('active', el.dataset.screen === tab));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.getElementById('topbarSub').textContent = TAB_LABELS[tab];
  if (!loadedTabs.has(tab)) {
    loadedTabs.add(tab);
    if (tab === 'blocks') await loadBlocks();
    else if (tab === 'comps') await loadCompositions();
    else await loadMonitoring();
  }
}

// ── Blocks ───────────────────────────────────────────────────────────────
async function loadBlocks() {
  const rows = await jget(API + '/admin/api/prompts/blocks');
  const byOwner = {};
  rows.forEach(b => { (byOwner[b.owner] = byOwner[b.owner] || []).push(b); });
  const html = Object.keys(byOwner).sort().map(owner => `
    <div class="list-group-label">${esc(owner)}</div>
    ${byOwner[owner].map(b => `
      <div class="list-row" data-key="${esc(b.block_key)}">
        <div class="list-row-title">${esc(b.block_key)}</div>
        <div class="list-row-meta">
          <span class="pill pill-live">v${b.active_version ?? '—'} live</span>
          ${b.has_authority_version ? '<span class="pill pill-authority">authority</span>' : ''}
          ${b.version_count} version${b.version_count === 1 ? '' : 's'}
        </div>
      </div>`).join('')}
  `).join('');
  const el = document.getElementById('blocksList');
  el.innerHTML = html || '<div class="empty">No blocks yet.</div>';
  el.querySelectorAll('.list-row').forEach(r => r.addEventListener('click', () => selectBlock(r.dataset.key, r)));
}

async function selectBlock(blockKey, rowEl) {
  document.querySelectorAll('#blocksList .list-row').forEach(r => r.classList.remove('selected'));
  if (rowEl) rowEl.classList.add('selected');
  const versions = await jget(API + `/admin/api/prompts/blocks/${encodeURIComponent(blockKey)}/versions`);
  const latest = versions[0];
  const timelineHtml = versions.map((v, idx) => {
    const prev = versions[idx + 1];
    const diffHtml = prev ? renderDiff(lineDiff(prev.template_body, v.template_body)) : `<span class="diff-ctx">${esc(v.template_body.slice(0, 400))}${v.template_body.length > 400 ? '…' : ''}</span>`;
    return `
      <div class="tl-item">
        <div class="tl-dot ${v.active ? 'live' : ''}"></div>
        <div class="tl-card">
          <div class="tl-head">
            <span class="tl-ver">v${v.version}</span>
            <span class="pill ${v.active ? 'pill-live' : 'pill-off'}">${v.active ? 'active' : 'inactive'}</span>
            ${v.is_authority ? '<span class="pill pill-authority">authority</span>' : ''}
            <span class="tl-meta">${esc(v.created_by)} · ${relTime(v.created_at)}</span>
          </div>
          <div class="tl-diff">${diffHtml}</div>
          <div class="tl-actions">
            <button class="btn ${v.active ? 'danger' : ''}" data-toggle="${v.version}" data-active="${v.active}">${v.active ? 'Deactivate' : 'Activate'}</button>
          </div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('blocksDetail').innerHTML = `
    <div class="crumbs">${esc(latest.owner)} / ${esc(latest.role)}</div>
    <div class="h1">${esc(blockKey)}</div>
    <div class="lede">${latest.is_authority ? 'Authority block — ' : ''}${versions.length} version${versions.length === 1 ? '' : 's'}, current is v${latest.version}.</div>
    <div class="section-label">Version history (newest first, diffed against the version below it)</div>
    <div class="timeline">${timelineHtml}</div>
    <div class="editor-card">
      <div class="editor-title">Create new version — starts from v${latest.version}</div>
      <textarea class="editor-body" id="newBody">${esc(latest.template_body)}</textarea>
      <label><input type="checkbox" id="newActivate" checked/> Activate immediately</label>
      <div class="tl-actions">
        <button class="btn primary" id="saveVersionBtn">Save as v${latest.version + 1}</button>
      </div>
    </div>
  `;
  document.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', async () => {
    const v = Number(btn.dataset.toggle);
    const currentlyActive = btn.dataset.active === 'true';
    try {
      await jpost(API + `/admin/api/prompts/blocks/${encodeURIComponent(blockKey)}/versions/${v}/active`, { active: !currentlyActive, actor });
      await selectBlock(blockKey, rowEl);
      loadedTabs.delete('blocks'); await loadBlocks();
      document.querySelector(`#blocksList [data-key="${CSS.escape(blockKey)}"]`)?.classList.add('selected');
    } catch (e) { alert('Failed: ' + e.message); }
  }));
  document.getElementById('saveVersionBtn').addEventListener('click', async () => {
    const body = document.getElementById('newBody').value;
    const activate = document.getElementById('newActivate').checked;
    try {
      await jpost(API + `/admin/api/prompts/blocks/${encodeURIComponent(blockKey)}/versions`, {
        template_body: body, block_kind: latest.block_kind, role: latest.role,
        condition: latest.condition, is_authority: latest.is_authority,
        directives: latest.directives || [], owner: latest.owner,
        created_by: actor, activate,
      });
      loadedTabs.delete('blocks'); await loadBlocks();
      await selectBlock(blockKey, document.querySelector(`#blocksList [data-key="${CSS.escape(blockKey)}"]`));
    } catch (e) { alert('Failed: ' + e.message); }
  });
}

// ── Compositions ─────────────────────────────────────────────────────────
async function loadCompositions() {
  const rows = await jget(API + '/admin/api/prompts/compositions');
  const el = document.getElementById('compsList');
  el.innerHTML = rows.map(c => `
    <div class="list-row" data-id="${c.id}">
      <div class="list-row-title">${esc(c.prompt_address || c.module_key)}</div>
      <div class="list-row-meta">
        <span class="pill ${c.active ? 'pill-live' : 'pill-off'}">${c.active ? 'active' : c.status}</span>
        ${esc(c.module_key)} · ${c.block_count} block${c.block_count === 1 ? '' : 's'} · v${c.version}
      </div>
    </div>`).join('') || '<div class="empty">No compositions yet.</div>';
  el.querySelectorAll('.list-row').forEach(r => r.addEventListener('click', () => selectComposition(Number(r.dataset.id), r)));
}

async function selectComposition(id, rowEl) {
  document.querySelectorAll('#compsList .list-row').forEach(r => r.classList.remove('selected'));
  if (rowEl) rowEl.classList.add('selected');
  const data = await jget(API + `/admin/api/prompts/compositions/${id}`);
  const c = data.composition;
  let mon = null;
  try { mon = await jget(API + `/admin/api/prompts/monitoring/${id}?days=7`); } catch (e) {}
  const statCards = (mon && mon.by_hash && mon.by_hash.length)
    ? mon.by_hash.map(h => `
        <div class="card">
          <div class="section-label" style="margin:0 0 8px">hash <span class="mono">${esc((h.composition_hash||'').slice(0,16))}…</span></div>
          <div class="stat-grid">
            <div class="stat"><div class="stat-label">Calls (7d)</div><div class="stat-value">${h.call_count}</div></div>
            <div class="stat"><div class="stat-label">Avg latency</div><div class="stat-value">${fmtNum(h.avg_latency_ms,0)}ms</div></div>
            <div class="stat"><div class="stat-label">Avg quality</div><div class="stat-value">${fmtNum(h.avg_quality,2)}</div></div>
            <div class="stat"><div class="stat-label">Cost (7d)</div><div class="stat-value">$${fmtNum(h.total_cost_usd,3)}</div></div>
          </div>
        </div>`).join('')
    : '<div class="empty">No calls in the last 7 days.</div>';

  document.getElementById('compsDetail').innerHTML = `
    <div class="crumbs">module_key: ${esc(c.module_key)}</div>
    <div class="h1">${esc(c.prompt_address || c.module_key)}</div>
    <div class="lede">variant ${esc(c.variant_id)} · status ${esc(c.status)}</div>
    <div class="card">
      <dl class="kv">
        <dt>module_key</dt><dd>${esc(c.module_key)}</dd>
        <dt>prompt_address</dt><dd>${esc(c.prompt_address || '(none)')}</dd>
        <dt>composition_hash</dt><dd>${esc((c.composition_hash||'').slice(0,24))}…</dd>
        <dt>created</dt><dd>${fmtWhen(c.created_at)} by ${esc(c.created_by)}</dd>
      </dl>
    </div>
    <div class="section-label">Members (ordered)</div>
    <table class="data"><thead><tr><th>#</th><th>block_key</th><th>pinned</th><th>effective v</th><th></th></tr></thead>
    <tbody>${data.members.map(m => `
      <tr>
        <td>${m.position}</td>
        <td class="mono">${esc(m.block_key)}</td>
        <td>${m.pinned_version ?? 'float'}</td>
        <td>${m.effective_version}</td>
        <td>${m.is_authority ? '<span class="pill pill-authority">authority</span>' : ''}</td>
      </tr>`).join('')}</tbody></table>
    <div class="section-label">Live monitoring (7d)</div>
    ${statCards}
  `;
}

// ── Monitoring ───────────────────────────────────────────────────────────
function sparkline(daily) {
  if (!daily || !daily.length) return '—';
  const max = Math.max(1, ...daily);
  return '<span class="spark">' + daily.map(n => `<i style="height:${Math.max(2, Math.round((n / max) * 16))}px" title="${n}"></i>`).join('') + '</span>';
}

async function loadMonitoring() {
  const rows = await jget(API + '/admin/api/prompts/monitoring?days=7');
  document.getElementById('monDetail').innerHTML = `
    <div class="section-label" style="margin-top:0">Fleet — trailing 7 days</div>
    <table class="data"><thead><tr><th>module_key</th><th>prompt_address</th><th>calls</th><th>trend</th><th>avg latency</th><th>avg quality</th><th>cost</th><th>last call</th></tr></thead>
    <tbody>${rows.map(r => `
      <tr>
        <td class="mono">${esc(r.module_key)}</td>
        <td class="mono">${esc(r.prompt_address || '—')}</td>
        <td>${r.call_count || 0}</td>
        <td>${sparkline(r.daily)}</td>
        <td>${fmtNum(r.avg_latency_ms,0)}ms</td>
        <td>${fmtNum(r.avg_quality,2)}</td>
        <td>$${fmtNum(r.total_cost_usd,3)}</td>
        <td>${relTime(r.last_called_at)}</td>
      </tr>`).join('')}</tbody></table>
  `;
}

selectTab('blocks');
</script>
</body>
