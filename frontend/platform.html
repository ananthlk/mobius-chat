<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform — Mobius</title>
  <link rel="icon" href="static/logo.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f11;
      color: #f1f0ee;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 44px;
      border-bottom: 0.5px solid rgba(255,255,255,0.09);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      background: #141416;
    }
    .topbar-back {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      border: none;
      background: none;
      cursor: pointer;
      padding: 4px 0;
      border-radius: 4px;
      transition: color .15s;
    }
    .topbar-back:hover { color: rgba(255,255,255,0.75); }
    .topbar-back svg { width: 14px; height: 14px; }
    .topbar-divider { width: 0.5px; height: 16px; background: rgba(255,255,255,0.12); }
    .topbar-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
    }
    .topbar-title img { width: 18px; height: 18px; opacity: 0.8; }
    .tabs {
      height: 40px;
      border-bottom: 0.5px solid rgba(255,255,255,0.09);
      display: flex;
      gap: 0;
      padding: 0 16px;
      overflow-x: auto;
      flex-shrink: 0;
      background: #141416;
    }
    .tab {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    .tab:hover { color: rgba(255,255,255,0.7); }
    .tab.active {
      color: rgba(255,255,255,0.9);
      border-bottom-color: #7c3aed;
    }
    .content-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .content {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
    }
    .content.active { display: flex; }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0f0f11;
      pointer-events: none;
    }
    #loading.hidden { display: none; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-size: 12px; color: rgba(255,255,255,0.3); }
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .module-card {
      background: #1a1a1e;
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .module-card:hover {
      background: #252529;
      border-color: rgba(255,255,255,0.2);
    }
    .module-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f0ee;
      margin-bottom: 6px;
    }
    .module-status {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    /* kind: agent decides, skill is a reusable task — the distinction is the
       point, so it gets a badge rather than being implied by position */
    .kind {
      margin-left: 8px; font-size: 9px; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; padding: 2px 6px; border-radius: 4px;
      vertical-align: middle; border: 1px solid transparent;
    }
    .kind-agent      { color:#c4b5fd; border-color:rgba(167,139,250,0.45); }
    .kind-skill      { color:#7dd3fc; border-color:rgba(125,211,252,0.45); }
    .kind-surface    { color:#86efac; border-color:rgba(134,239,172,0.40); }
    .kind-store      { color:#fcd34d; border-color:rgba(252,211,77,0.40); }
    .kind-worker     { color:#fca5a5; border-color:rgba(252,165,165,0.40); }
    .kind-governance { color:#d1d5db; border-color:rgba(209,213,219,0.35); }

    .called-by { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .called-by-label {
      font-size: 9px; text-transform: uppercase; letter-spacing: .07em;
      color: rgba(255,255,255,0.35); margin-right: 2px;
    }
    .consumer {
      font-size: 10px; padding: 2px 7px; border-radius: 999px;
      background: rgba(125,211,252,0.10); color: #7dd3fc;
    }

    .components { margin-top: 11px; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 9px; }
    /* Service name and stage on one line, description beneath. Side-by-side
       squeezed the description into an unreadable ribbon inside a card. */
    .component { margin-bottom: 9px; font-size: 11px; }
    .component code {
      color: rgba(255,255,255,0.75); font-size: 10.5px;
      overflow-wrap: anywhere;
    }
    .component-desc {
      display: block; color: rgba(255,255,255,0.40); font-size: 10.5px;
      line-height: 1.45; margin-top: 2px;
    }
    .stage {
      display: inline-block; font-size: 9px; text-transform: uppercase;
      letter-spacing: .06em; font-weight: 700; color: #a78bfa;
      min-width: 46px;
    }

    /* 7+1 layer framework grouping */
    .layer-block { margin-bottom: 34px; }
    .layer-head {
      display: flex; align-items: baseline; gap: 10px;
      padding-bottom: 8px; margin-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .layer-label {
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: #a78bfa;
    }
    .layer-name { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.92); }
    .layer-count {
      margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,0.4);
    }
    .layer-desc {
      font-size: 12px; color: rgba(255,255,255,0.45);
      margin: 0 0 14px;
    }
    .layer-row td {
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: #a78bfa; padding-top: 18px; border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .status-live { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .status-building { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .status-partial { background: rgba(251, 146, 60, 0.2); color: #fed7aa; }
    .status-blocked { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .status-frozen { background: rgba(107, 114, 128, 0.2); color: #d1d5db; }
    .module-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .module-owner {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 4px;
    }
    .module-gates {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 8px;
      text-align: left;
      border-bottom: 0.5px solid rgba(255,255,255,0.1);
    }
    th {
      background: #1a1a1e;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
    }
    td { color: rgba(255,255,255,0.6); }
    td a { color: #7c3aed; text-decoration: none; }
    td a:hover { text-decoration: underline; }
    .gate-row {
      display: grid;
      grid-template-columns: auto 1fr auto auto auto;
      gap: 16px;
      padding: 12px;
      background: #1a1a1e;
      border-radius: 6px;
      margin-bottom: 8px;
      align-items: center;
    }
    .gate-num { font-weight: 700; color: #7c3aed; font-size: 14px; }
    .gate-name { font-weight: 600; color: #f1f0ee; }
    .gate-status { padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 500; }
    .coord-entry {
      background: #1a1a1e;
      border-left: 2px solid #7c3aed;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 4px;
    }
    .coord-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .coord-from { color: #93c5fd; }
    .coord-type { background: rgba(124, 58, 237, 0.2); color: #a78bfa; padding: 2px 6px; border-radius: 2px; font-size: 10px; }
    .coord-body { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .faq-item {
      background: #1a1a1e;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 6px;
    }
    .faq-question { font-weight: 600; color: #f1f0ee; margin-bottom: 8px; font-size: 13px; }
    .faq-answer { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.5; }
    .status-block {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .status-card {
      background: #1a1a1e;
      padding: 12px;
      border-radius: 6px;
      border: 0.5px solid rgba(255,255,255,0.1);
    }
    .status-label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
    .status-value { font-size: 18px; font-weight: 700; color: #86efac; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="topbar-back" aria-label="Back to chat">
      <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </a>
    <div class="topbar-divider"></div>
    <div class="topbar-title">
      <img src="static/logo.svg" alt="" aria-hidden="true" />
      Platform
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="product">Product</button>
    <button class="tab" data-tab="technical">Technical</button>
    <button class="tab" data-tab="specs">Specs</button>
    <button class="tab" data-tab="roadmap">Roadmap</button>
    <button class="tab" data-tab="sprints">Sprints</button>
    <button class="tab" data-tab="coordination">Coordination</button>
    <button class="tab" data-tab="eval">Eval/QA</button>
    <button class="tab" data-tab="learn">Learn</button>
    <button class="tab" data-tab="releases">Releases</button>
    <button class="tab" data-tab="status">Status</button>
  </div>

  <div class="content-wrap">
    <div id="loading">
      <div class="spinner"></div>
      <span class="loading-label">Loading platform…</span>
    </div>
    <div id="product" class="content active"></div>
    <div id="technical" class="content"></div>
    <div id="specs" class="content"></div>
    <div id="roadmap" class="content"></div>
    <div id="sprints" class="content"></div>
    <div id="coordination" class="content"></div>
    <div id="eval" class="content"></div>
    <div id="learn" class="content"></div>
    <div id="releases" class="content"></div>
    <div id="status" class="content"></div>
  </div>

  <script>
    (function () {
      var loading = document.getElementById('loading');
      var tabs = document.querySelectorAll('.tab');
      var contents = document.querySelectorAll('.content');
      var platform = null;

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          var tabName = tab.dataset.tab;
          tabs.forEach(t => t.classList.remove('active'));
          contents.forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tabName).classList.add('active');
        });
      });

      Promise.all([
        fetch('/api/platform/definition', { cache: 'no-cache' }).then(r => r.json()).catch(() =>
          fetch('https://raw.githubusercontent.com/ananthlk/Mobius-Master/main/docs/platform-definition.json', { cache: 'no-cache' }).then(r => r.json())
        ),
        fetch('/api/platform/status', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({})),
        fetch('/api/platform/coordination', { cache: 'no-cache' }).then(r => r.text()).catch(() => ''),
        fetch('/api/platform/releases', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ releases: [] }))
      ])
        .then(([def, status, coord, rel]) => {
          platform = def;
          renderAll(status, coord);
          renderReleases(rel);
          loading.classList.add('hidden');
        })
        .catch(err => {
          console.error('Failed to load platform:', err);
          loading.innerHTML = '<span style="color: rgba(255,255,255,0.5)">Failed to load platform</span>';
        });

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      }

      function renderReleases(data) {
        var el = document.getElementById('releases');
        var rels = (data && data.releases) || [];
        if (!rels.length) {
          el.innerHTML = '<div class="content-wrap"><p class="module-desc">' +
            'No release manifests found. Cut one with ' +
            '<code>scripts/release/cut_product_release.py</code>.</p></div>';
          return;
        }
        var html = '<div class="content-wrap">';
        rels.forEach(function (r) {
          var mods = r.modules || [];
          var tagged = mods.filter(m => m.version).length;
          // Surface the caveats rather than only the happy count — a release
          // page that hides which modules were tagged off main is worse than
          // no page, because people will trust it.
          var offMain = mods.filter(m => m.branch && m.branch !== 'main');
          var excluded = mods.reduce((a, m) => a + (m.uncommitted_files_excluded || 0), 0);

          html += '<h2 class="module-name" style="font-size:18px;margin:0 0 4px">' +
                  esc(r.product_version) + '</h2>';
          html += '<p class="module-owner" style="margin:0 0 14px">cut ' +
                  esc((r.cut_at || '').replace('T', ' ').replace('+00:00', ' UTC')) +
                  ' &middot; ' + tagged + ' of ' + mods.length + ' modules tagged</p>';

          if (offMain.length || excluded) {
            html += '<div class="status-block" style="margin-bottom:16px">';
            if (offMain.length) {
              html += '<div class="status-card"><div class="status-label">Tagged off main</div>' +
                offMain.map(m => '<div class="module-desc" style="margin:2px 0">' +
                  esc(m.module) + ' &rarr; <code>' + esc(m.branch) + '</code></div>').join('') +
                '</div>';
            }
            if (excluded) {
              html += '<div class="status-card"><div class="status-label">Uncommitted at cut time</div>' +
                '<div class="module-desc" style="margin:2px 0">' + excluded +
                ' file(s) excluded &mdash; a tag points at a commit, so this work is not in the release.</div></div>';
            }
            html += '</div>';
          }

          html += '<div class="module-grid">';
          mods.forEach(function (m) {
            var cls = m.version ? 'status-live' : 'status-blocked';
            html += '<div class="module-card">' +
              '<div class="module-name">' + esc(m.module) + '</div>' +
              '<span class="module-status ' + cls + '">' + esc(m.version || 'untagged') + '</span>' +
              '<div class="module-desc" style="margin-top:8px"><code>' +
              esc(m.commit_short || '') + '</code> &middot; ' + (m.commits_total || 0) + ' commits' +
              (m.branch && m.branch !== 'main'
                ? '<br><span style="color:#fed7aa">branch: ' + esc(m.branch) + '</span>' : '') +
              (m.uncommitted_files_excluded
                ? '<br><span style="color:rgba(255,255,255,0.45)">' +
                  m.uncommitted_files_excluded + ' uncommitted file(s) excluded</span>' : '') +
              '</div>' +
              (m.notes ? '<div class="module-owner"><a href="/docs/' +
                esc((m.notes || '').split('/').pop().replace('.md', '')) +
                '" style="color:#93c5fd">release notes</a></div>' : '') +
              '</div>';
          });
          html += '</div>';

          var pre = r.pre_release || [];
          if (pre.length) {
            html += '<h3 class="module-name" style="font-size:14px;margin:22px 0 6px">Pre-release &mdash; carried, untagged</h3>' +
              '<p class="module-desc" style="margin:0 0 8px">Too early to claim a version. Listed so the manifest is complete rather than flattering.</p>' +
              '<p class="module-desc">' +
              pre.map(m => esc(m.module) + ' <span style="opacity:.55">(' +
                (m.commits_total || 0) + 'c)</span>').join(' &middot; ') + '</p>';
          }
          var dep = r.deprecated || [];
          if (dep.length) {
            html += '<h3 class="module-name" style="font-size:14px;margin:22px 0 6px">Deprecated</h3>' +
              dep.map(m => '<p class="module-desc">' + esc(m.module) + ' &mdash; ' +
                esc(m.reason) + '</p>').join('');
          }
          html += '<p class="module-owner" style="margin-top:22px">' +
            '<a href="/docs/product-' + esc(r.product_version.replace('product-', '')) +
            '" style="color:#93c5fd">Read the release story</a> &middot; ' +
            '<a href="/docs/RELEASE_PROCESS" style="color:#93c5fd">How versioning works</a></p>';
        });
        el.innerHTML = html + '</div>';
      }

      function renderAll(status, coord) {
        renderProductView();
        renderTechnicalView();
        renderSpecsView();
        renderRoadmap();
        renderSprints();
        renderCoordination(coord);
        renderEvalView();
        renderLearnView();
        renderStatusView(status);
      }

      // The 7+1 layer framework is the platform's organising idea, so the module
      // views group by it rather than presenting one flat grid. A module with no
      // layer falls into "Unplaced" instead of disappearing — silently dropping a
      // module from the framework is the one failure this view must not have.
      function byLayer(renderCard) {
        var layers = (platform.layers || []).slice();
        var mods = platform.modules || [];
        var html = '';
        layers.forEach(function (L) {
          var inLayer = mods.filter(m => m.layer === L.layer);
          if (!inLayer.length) return;
          html += '<div class="layer-block">' +
            '<div class="layer-head">' +
              '<span class="layer-label">' + esc(L.label) + '</span>' +
              '<span class="layer-name">' + esc(L.name) + '</span>' +
              '<span class="layer-count">' + inLayer.length + '</span>' +
            '</div>' +
            '<p class="layer-desc">' + esc(L.description) + '</p>' +
            '<div class="module-grid">' + inLayer.map(renderCard).join('') + '</div>' +
          '</div>';
        });
        var unplaced = mods.filter(m => m.layer === undefined || m.layer === null);
        if (unplaced.length) {
          html += '<div class="layer-block"><div class="layer-head">' +
            '<span class="layer-label">Unplaced</span>' +
            '<span class="layer-name">Not yet assigned to a layer</span>' +
            '<span class="layer-count">' + unplaced.length + '</span></div>' +
            '<div class="module-grid">' + unplaced.map(renderCard).join('') + '</div></div>';
        }
        return html;
      }

      function renderProductView() {
        document.getElementById('product').innerHTML = byLayer(function (m) {
          var status = m.user_view.status;
          var html = '<div class="module-card">' +
            '<div class="module-name">' + esc(m.name) +
              (m.kind ? '<span class="kind kind-' + esc(m.kind) + '">' + esc(m.kind) + '</span>' : '') +
            '</div>' +
            '<div class="module-status status-' + esc(status) + '">' + esc(status.toUpperCase()) + '</div>' +
            '<div class="module-desc">' + esc(m.user_view.description) + '</div>';

          // A skill is a task reused by many agents, so the useful fact about it
          // is who calls it — not which layer it sits in.
          if (m.consumers && m.consumers.length) {
            html += '<div class="called-by"><span class="called-by-label">Called by</span>' +
              m.consumers.map(c => '<span class="consumer">' + esc(c) + '</span>').join('') +
              '</div>';
          }

          // What the role actually runs on. Roles alone hid the fact that
          // chunking and embedding are separate deployed workers.
          if (m.components && m.components.length) {
            html += '<div class="components">';
            m.components.forEach(function (c) {
              html += '<div class="component">' +
                (c.stage ? '<span class="stage">' + esc(c.stage) + '</span>' : '') +
                '<code>' + esc(c.service) + '</code>' +
                '<span class="component-desc">' + esc(c.description) + '</span>' +
              '</div>';
            });
            html += '</div>';
          }

          html += '<div class="module-owner">Surface: ' + esc(m.user_view.surface || 'N/A') + '</div>';
          return html + '</div>';
        });
      }

      function renderTechnicalView() {
        var mods = platform.modules || [];
        var rows = '';
        (platform.layers || []).forEach(function (L) {
          var inLayer = mods.filter(m => m.layer === L.layer);
          if (!inLayer.length) return;
          // A spanning row keeps the layer visible while scanning a long table —
          // the grouping is the point of the view, not decoration.
          rows += '<tr class="layer-row"><td colspan="4">' + esc(L.label) +
                  ' &middot; ' + esc(L.name) + '</td></tr>';
          inLayer.forEach(function (m) {
            var tv = m.technical_view || {};
            rows += '<tr>' +
              '<td><strong>' + esc(m.name) + '</strong><br><small style="color:rgba(255,255,255,0.4)">' +
                esc(tv.module || '') + '</small></td>' +
              '<td>' + esc(tv.owner || '—') + '</td>' +
              '<td><span class="module-status status-' + esc(tv.status || '') + '">' +
                esc(tv.status || '—') + '</span></td>' +
              '<td><small>' + esc(tv.repo || (m.git_view && m.git_view.repo) || '—') + '</small></td>' +

          '<div class="table-wrap"><table><tr><th>Module</th><th>Owner</th><th>Status</th><th>Repo</th></tr>' +
          rows + '</table></div>';

      function renderSpecsView() {

          html += '<td>' + linkHtml + '</td>';
          html += '<td>' + (m.specs_view.status || 'N/A') + '</td>';

      function renderRoadmap() {

        html += '<div style="background: #1a1a1e; padding: 12px; border-radius: 6px; margin-bottom: 16px;">';

            html += '<div class="gate-row">';
            html += '<div class="gate-num">Gate ' + gateNum + '</div>';

      function renderSprints() {
        var html = '<div style="max-width: 1000px;">';
        html += '<h2 style="margin-bottom: 16px; font-size: 16px;">Platform Coherence Sprint Board</h2>';
        html += '<div style="background: #1a1a1e; padding: 12px; border-radius: 6px; margin-bottom: 16px;">';

        html += '<strong>Target Completion:</strong> Oct 12, 2026<br>';

        html += '<strong>Status:</strong> Continuous refinement (roadmap + sprint board + onboarding)';
        html += '</div></div>';
        html += '<div style="margin-bottom: 16px;">';
        html += '<h3 style="font-size: 13px; margin-bottom: 12px; font-weight: 600;">8-Phase Platform Coherence Progression</h3>';
        var phases = [
          { num: 1, name: 'Survey & Frame', status: '✅ Done', desc: 'Map all 23 modules across 5 lenses' },
          { num: 2, name: 'Agent Sign-Off', status: '✅ Done', desc: 'Each agent confirms own module details' },
          { num: 3, name: 'Specs Unification', status: '🔨 In Progress', desc: 'Single framework, consistent terminology' },

          { num: 6, name: 'Documentation Complete', status: '📋 Planned', desc: 'All specs drafted, linked, searchable' },
          { num: 7, name: 'Onboarding Live', status: '📋 Planned', desc: 'New team members self-serve' },
          { num: 8, name: 'Platform Live', status: '📋 Planned', desc: 'This dashboard is the source of truth' }
        ];
        phases.forEach(p => {
          html += '<div class="gate-row">';
          html += '<div class="gate-num">P' + p.num + '</div>';
          html += '<div><div class="gate-name">' + p.name + '</div><div style="font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px;">' + p.desc + '</div></div>';
          html += '<div style="font-size: 11px; font-weight: 600;">' + p.status + '</div>';
          html += '</div>';
        });
        html += '</div></div>';
        document.getElementById('sprints').innerHTML = html;
      }

      function renderCoordination(coordText) {
        var html = '<div style="max-width: 900px;">';
        html += '<h2 style="margin-bottom: 16px; font-size: 16px;">Cross-Agent Coordination</h2>';
        html += '<div style="font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 16px;">';
        html += 'Append-only ledger: all cross-team agreements, blockers, and sign-offs tracked in git';
        html += '</div>';

        if (coordText) {
          var entries = coordText.match(/\*\*PA-\d+.*?\n(?:[\s\S]*?)(?=\n\*\*PA-|\n---|\Z)/g) || [];
          if (entries.length === 0) {
            entries = coordText.match(/\*\*(PA-[^*]*)\*\*[\s\S]*?(?=(?:\n\*\*[^*]|\n---|\Z))/g) || [];
          }
          entries.forEach(entry => {
            var lines = entry.split('\n');
            var header = lines[0];
            var body = lines.slice(1).join('\n').trim();
            html += '<div class="coord-entry">';
            html += '<div class="coord-header">';
            html += '<span class="coord-from">' + header + '</span>';
            html += '<span class="coord-type">' + (body.includes('DECISION') ? 'DECISION' : body.includes('ANSWER') ? 'ANSWER' : 'ASK') + '</span>';
            html += '</div>';
            html += '<div class="coord-body">' + escapeHtml(body.substring(0, 500)) + (body.length > 500 ? '…' : '') + '</div>';
            html += '</div>';
          });
        }
        if (entries.length === 0) {
          html += '<div style="color: rgba(255,255,255,0.4); font-size: 12px;">Loading coordination entries…</div>';
        }
        html += '</div>';
        document.getElementById('coordination').innerHTML = html;
      }

      function renderEvalView() {
        var html = '<div class="table-wrap"><table><tr><th>Module</th><th>Owned By</th><th>Gates</th><th>Status</th></tr>';
        platform.modules.forEach(m => {
          var gates = m.gates ? m.gates.join(', ') : '—';
          html += '<tr>';
          html += '<td><strong>' + m.name + '</strong></td>';
          html += '<td>' + (m.eval_view.owned_by || '—') + '</td>';
          html += '<td>' + gates + '</td>';
          html += '<td>' + (m.eval_view.status || '—') + '</td>';
          html += '</tr>';
        });
        html += '</table></div>';
        document.getElementById('eval').innerHTML = html;
      }

        html += '<p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 12px; line-height: 1.5;">Mobius is built in 7 layers + Deep Research. Click any layer or component to see UI links, database schemas, APIs, ownership, and roadmap.</p>';
        html += '<div style="display: flex; gap: 8px; flex-wrap: wrap;">';
        html += '<a href="/docs/mobius-architecture-essay-complete.md" style="display: inline-block; padding: 6px 12px; background: #7c3aed; color: white; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: 500;" target="_blank">📖 Read Essay</a>';
        html += '<a href="/docs/mobius-architecture-diagram-complete.html" style="display: inline-block; padding: 6px 12px; background: #7c3aed; color: white; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: 500;" target="_blank">📊 View Diagram</a>';
        html += '<a href="/docs/mobius-architecture-drilldown-reference.md" style="display: inline-block; padding: 6px 12px; background: #7c3aed; color: white; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: 500;" target="_blank">🔍 Drilldown Reference</a>';
        html += '</div>';
        html += '</div>';

        html += '<div style="margin-bottom: 24px;">';
        html += '<h3 style="font-size: 13px; font-weight: 600; margin-bottom: 12px;">Sourcing & Ingestion Pipeline (Foundation)</h3>';
        html += '<div style="background: #1a1a1e; border-left: 3px solid #f59e0b; border-radius: 6px; padding: 12px; margin-bottom: 12px;">';
        html += '<div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">Raw Documents → Indexed Intelligence</div>';
        html += '<div style="display: flex; gap: 6px; flex-wrap: wrap;">';
        var pipelineSteps = ['Sourcing Agent', 'Extraction (Tables/Sections)', 'Chunking', 'Tagging (Lexicon)', 'Embedding', 'Publishing'];
        pipelineSteps.forEach(step => {
          html += '<span style="display: inline-block; background: rgba(245, 158, 11, 0.1); color: #fbbf24; padding: 4px 8px; border-radius: 4px; font-size: 11px; border: 0.5px solid rgba(245, 158, 11, 0.3);">' + step + '</span>';
        });
        html += '</div>';
        html += '<div style="font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 8px;">↓ Feeds INTO Layer 6 (Intelligence)</div>';
        html += '</div>';

        html += '<h3 style="font-size: 13px; font-weight: 600; margin-bottom: 12px;">7-Layer Stack + Deep Research</h3>';
        var layers = [
          { num: 1, name: 'Surfaces', components: ['Chat', 'API', 'Chrome Extension', 'Mobile/Dashboard'] },
          { num: 2, name: 'Router & Optimizer', components: ['Prompt Composer', 'Mode Selector', 'Strategy Selector', 'Bandit Optimizer'] },
          { num: 3, name: 'Platform Agents', components: ['Product Awareness', 'Eval Command Center', 'User Manager', 'Org Agent', 'Feedback Agent', 'Technical Review'] },
          { num: 4, name: 'Domain Agents', components: ['Credentialing', 'Strategy', 'Appeals', 'Sourcing', 'Curation', 'Roster', 'Prior Auth', 'Engagement'] },
          { num: 5, name: 'Skills', components: ['Email', 'Tasks', 'Download', 'Feedback', 'Vault', 'Deep Research'] },
          { num: 6, name: 'Intelligence', components: ['Fact Store', 'RAG Corpus', 'Embeddings', 'Vector Index', 'Citation Engine'] },
          { num: 7, name: 'Evaluation & Feedback', components: ['Accuracy Grading', 'Coverage Analysis', 'Latency Tracking', 'Clarity Assessment', 'Gap Signaling'] }
        ];

        layers.forEach(layer => {
          html += '<div style="background: #1a1a1e; border-left: 3px solid #7c3aed; border-radius: 6px; padding: 12px; margin-bottom: 12px;">';
          html += '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">';
          html += '<div><span style="font-size: 18px; font-weight: 700; color: #7c3aed; margin-right: 8px;">L' + layer.num + '</span><span style="font-size: 13px; font-weight: 600;">' + layer.name + '</span></div>';
          html += '</div>';
          html += '<div style="display: flex; gap: 6px; flex-wrap: wrap;">';
          layer.components.forEach(comp => {
            html += '<span style="display: inline-block; background: rgba(124, 58, 237, 0.1); color: #a78bfa; padding: 4px 8px; border-radius: 4px; font-size: 11px; border: 0.5px solid rgba(124, 58, 237, 0.3);">' + comp + '</span>';
          });
          html += '</div>';
          html += '</div>';
        });

        html += '<div style="background: #1a1a1e; border: 2px dashed #7c3aed; border-radius: 6px; padding: 12px; margin-bottom: 12px;">';
        html += '<div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">🔄 Deep Research (Parallel System)</div>';
        html += '<div style="display: flex; gap: 6px; flex-wrap: wrap;">';
        var drComponents = ['Gap Identification', 'Research', 'Verification', 'Fact Store Ingestion', 'RAG Corpus Ingestion'];
        drComponents.forEach(comp => {
          html += '<span style="display: inline-block; background: rgba(124, 58, 237, 0.1); color: #a78bfa; padding: 4px 8px; border-radius: 4px; font-size: 11px; border: 0.5px solid rgba(124, 58, 237, 0.3);">' + comp + '</span>';
        });
        html += '</div>';
        html += '</div>';
        html += '</div>';

        var faqs = [
          { q: 'What is Mobius?', a: 'Mobius unlocks network-scale Revenue Cycle Management intelligence. It connects organizations to a shared corpus of payer policies, denial patterns, and operational best practices.' },
          { q: 'What are the 8 RCM Gates?', a: '1. Claim Closure (auto-post), 2. Denial Management, 3. Eligibility Verification, 4. Payor Policies & Benefits, 5. Credentialing, 6. Authorization/Appeals, 7. Coding & Claims, 8. Network Effects.' },
          { q: 'How do I navigate the architecture?', a: 'Start with "Read Essay" for the conceptual overview. Then "View Diagram" for visual layers. Then "Drilldown Reference" to explore each component\'s UI links, schemas, APIs, and ownership.' },

          { q: 'Who owns what?', a: 'Technical tab shows ownership for all 23 modules. Each module has a single owner + contributing agents. See Coordination tab for multi-module decisions.' },
          { q: 'How do I report a bug?', a: 'See BUG_LOG.md in docs/. File with: title, repro steps, root cause hypothesis, severity. Platform Architects triage on slower days.' }
        ];

        html += '<h2 style="font-size: 16px; margin-bottom: 16px; margin-top: 24px;">FAQ</h2>';
        faqs.forEach(faq => {
          html += '<div class="faq-item">';
          html += '<div class="faq-question">' + faq.q + '</div>';
          html += '<div class="faq-answer">' + faq.a + '</div>';
          html += '</div>';
        });

        html += '<h3 style="font-size: 14px; margin-top: 24px; margin-bottom: 12px;">Key Documentation</h3>';
        var docs = [
          { name: 'mobius-model.md', desc: 'RCM Gates, tiers, vision, value capture' },
          { name: 'mobius-architecture-essay-complete.md', desc: 'Comprehensive narrative: 7 layers + Deep Research + why it works' },
          { name: 'mobius-architecture-drilldown-reference.md', desc: 'Component details: UIs, schemas, APIs, ownership, roadmap' },
          { name: 'RAG_FACTSTORE_COORDINATION.md', desc: 'All cross-agent agreements (git-backed)' },
          { name: 'BUG_LOG.md', desc: 'Known issues, blockers, repro steps' }
        ];
        docs.forEach(doc => {
          html += '<div style="background: #1a1a1e; padding: 8px 12px; border-radius: 4px; margin-bottom: 8px; font-size: 12px;">';

          html += '<span style="color: rgba(255,255,255,0.5);">' + doc.desc + '</span>';

        html += '</div>';
        document.getElementById('learn').innerHTML = html;
      }

      function renderStatusView(status) {
        var html = '<div style="max-width: 1200px;">';
        html += '<h2 style="margin-bottom: 16px; font-size: 16px;">Live System Status</h2>';

        if (status && status.status) {
          html += '<div class="status-block">';
          html += '<div class="status-card"><div class="status-label">AHCA Reingestion</div><div class="status-value">' + status.status + '/1160</div></div>';
          html += '<div class="status-card"><div class="status-label">Published Chunks</div><div class="status-value">' + (status.published_chunks ? Math.round(status.published_chunks / 1000000) + 'M' : '—') + '</div></div>';
          html += '<div class="status-card"><div class="status-label">Gate Verdicts</div><div class="status-value">' + Object.keys(status).filter(k => k.endsWith('_gate')).length + '</div></div>';
          html += '<div class="status-card"><div class="status-label">Active/Retired</div><div class="status-value">' + (status.active || 0) + '/' + (status.retired || 0) + '</div></div>';
          html += '</div>';

          if (status.gate_verdicts) {
            html += '<h3 style="font-size: 13px; margin-bottom: 12px; font-weight: 600;">Gate Verdicts</h3>';
            Object.keys(status.gate_verdicts).slice(0, 10).forEach(gate => {
              html += '<div style="background: #1a1a1e; padding: 8px 12px; border-radius: 4px; margin-bottom: 6px; font-size: 12px;">';
              html += '<strong>' + gate + ':</strong> ' + status.gate_verdicts[gate];
              html += '</div>';
            });
          }
        } else {
          html += '<div style="color: rgba(255,255,255,0.4); font-size: 12px;">No live status data available. Check back after AHCA sprint runs.</div>';
        }

        html += '<h3 style="font-size: 13px; margin-top: 24px; margin-bottom: 12px; font-weight: 600;">Known Blockers</h3>';
        var blockers = [
          'Specs-platform deployment: Cloud Run serving stale index.html (code correct, image issue)',
          'Observer Agent: wiring gated on calibration',
          'Historical Extraction: blocked on Chat↔RAG linkage + trace writer'
        ];
        blockers.forEach(b => {
          html += '<div style="background: #1a1a1e; padding: 8px 12px; border-radius: 4px; margin-bottom: 6px; font-size: 12px;">';
          html += '⚠️ ' + b;
          html += '</div>';
        });

        html += '</div>';
        document.getElementById('status').innerHTML = html;
      }

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    })();
  </script>
